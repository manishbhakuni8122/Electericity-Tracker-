;padding:10px 14px;margin:10px 0;font-size:12px;color:#1e40af}.imp-warn{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:12px;color:#92400e}.synci{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}.synci.ok{background:#22c55e}.synci.saving{background:#f59e0b;animation:pulse .8s infinite}.synci.err{background:#ef4444}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== DATE RANGE KPI ===== */
.date-range-kpi{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;background:#fff;border:2px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:220px;position:relative}
.date-range-kpi.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.date-range-kpi .dr-label{font-size:10px;font-weight:600;opacity:.85;white-space:nowrap}
.date-range-kpi .dr-val{font-size:18px;font-weight:800;line-height:1}
.date-range-kpi .dr-amt{font-size:9px;font-weight:700;opacity:.8}
.date-range-kpi input[type="date"]{padding:3px 5px;border:1px solid #cbd5e1;border-radius:5px;font-size:10px;outline:none;width:110px;background:#fff;color:#1e293b}
.date-range-kpi.on input[type="date"]{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff}
.dr-go{background:#7c3aed;color:#fff;border:none;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:10px;font-weight:700;white-space:nowrap}
.dr-go:hover{background:#6d28d9}
.date-range-kpi.on .dr-go{background:rgba(255,255,255,.25);color:#fff}
.dr-dl{background:#22c55e;color:#fff;border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:10px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:3px}
.dr-dl:hover{background:#16a34a}
.dr-clear{background:none;border:none;cursor:pointer;font-size:12px;color:#94a3b8;padding:0 2px}
.date-range-kpi.on .dr-clear{color:rgba(255,255,255,.7)}

/* ===== HISTORY PANEL ===== */
.hist-panel{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:95vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:1001;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease}
.hist-panel.open{transform:translateX(0)}
.hist-head{padding:16px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.hist-head h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hist-close{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;padding:0 4px}
.hist-close:hover{color:#ef4444}
.hist-body{flex:1;overflow-y:auto;padding:12px 16px}
.hist-item{padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;font-size:11px;position:relative;transition:background .15s}
.hist-item:hover{background:#f8fafc}
.hist-item .hi-time{font-size:9px;color:#94a3b8;font-weight:600}
.hist-item .hi-user{font-size:10px;font-weight:700;color:#3b82f6}
.hist-item .hi-action{margin-top:4px;color:#475569;line-height:1.4}
.hist-item .hi-action b{color:#1e293b}
.hist-item .hi-old{background:#fef2f2;color:#dc2626;padding:1px 5px;border-radius:3px;font-size:10px;text-decoration:line-through;margin-right:4px}
.hist-item .hi-new{background:#f0fdf4;color:#16a34a;padding:1px 5px;border-radius:3px;font-size:10px}
.hi-restore{display:inline-block;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:10px;font-weight:600;margin-top:6px;transition:all .15s}
.hi-restore:hover{background:#dbeafe;border-color:#3b82f6;box-shadow:0 1px 4px rgba(37,99,235,.2)}
.hi-restore-row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.hist-filter{padding:10px 16px;border-bottom:1px solid #e2e8f0;display:flex;gap:6px;align-items:center}
.hist-filter input,.hist-filter select{padding:5px 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:11px;outline:none}
.hist-filter input{flex:1}
.hist-empty{text-align:center;padding:40px 20px;color:#94a3b8}
.hist-empty .he-icon{font-size:36px;margin-bottom:8px}

/* ===== SNAPSHOTS ===== */
.hist-tabs{display:flex;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.hist-tab{flex:1;padding:10px 12px;font-size:11px;font-weight:700;color:#64748b;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.hist-tab:hover{color:#1e40af;background:#eff6ff}
.hist-tab.active{color:#1e40af;border-bottom-color:#1e40af;background:#fff}
.snap-item{padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;position:relative;transition:all .15s}
.snap-item:hover{border-color:#93c5fd;box-shadow:0 2px 8px rgba(59,130,246,.1)}
.snap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.snap-time{font-size:10px;font-weight:700;color:#1e40af}
.snap-user{font-size:9px;color:#64748b;font-weight:600}
.snap-label{font-size:12px;font-weight:600;color:#1e293b;margin-bottom:4px}
.snap-meta{font-size:10px;color:#94a3b8;display:flex;gap:12px;flex-wrap:wrap}
.snap-meta span{display:inline-flex;align-items:center;gap:3px}
.snap-actions{display:flex;gap:5px;margin-top:8px}
.snap-restore-btn{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:6px;padding:5px 14px;cursor:pointer;font-size:10px;font-weight:700;transition:all .15s}
.snap-restore-btn:hover{background:#dbeafe;border-color:#3b82f6}
.snap-dl-btn{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;border-radius:6px;padding:5px 14px;cursor:pointer;font-size:10px;font-weight:700;transition:all .15s}
.snap-dl-btn:hover{background:#dcfce7;border-color:#22c55e}
.snap-del-btn{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:10px;font-weight:700;transition:all .15s}
.snap-del-btn:hover{background:#fee2e2;border-color:#ef4444}
.snap-create-btn{width:100%;padding:10px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.snap-create-btn:hover{box-shadow:0 4px 12px rgba(30,64,175,.3);transform:translateY(-1px)}
.snap-auto-tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:8px;font-weight:700;background:#fef3c7;color:#92400e;margin-left:4px}
.snap-manual-tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:8px;font-weight:700;background:#eff6ff;color:#1e40af;margin-left:4px}
.snap-preview-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;display:flex;align-items:center;justify-content:center}
.snap-preview-content{background:#fff;border-radius:14px;padding:20px;width:900px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column}
.snap-preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.snap-preview-body{flex:1;overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
.snap-preview-body table{width:100%;border-collapse:collapse;font-size:11px}
.snap-preview-body th{padding:6px 8px;background:#f1f5f9;font-size:9px;font-weight:700;text-transform:uppercase;border:1px solid #e2e8f0;position:sticky;top:0}
.snap-preview-body td{padding:5px 8px;border:1px solid #e2e8f0}
.snap-diff{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:11px}
.snap-diff .diff-add{color:#16a34a;font-weight:600}.snap-diff .diff-del{color:#dc2626;font-weight:600}.snap-diff .diff-edit{color:#d97706;font-weight:600}

/* ===== LIVE INDICATOR ===== */
.live-dot{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#22c55e;margin-left:8px}
.live-dot .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:livePulse 2s infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.live-dot.off{color:#94a3b8}.live-dot.off .dot{background:#94a3b8;animation:none}

/* ===== DUPLICATE DETECTION ===== */
tr.dup-row{background:#fef3c7!important;border-left:3px solid #f59e0b}
tr.dup-row td{border-color:#fde68a}
tr.dup-row:hover{background:#fef9c3!important}
.dup-bar{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dup-bar .dup-info{font-size:12px;color:#92400e;font-weight:600;display:flex;align-items:center;gap:6px}
.dup-bar .dup-info .dup-count{background:#f59e0b;color:#fff;border-radius:12px;padding:1px 8px;font-size:11px;font-weight:800}
.dup-remove-btn{background:#ef4444;color:#fff;border:none;border-radius:7px;padding:6px 16px;cursor:pointer;font-size:11px;font-weight:700;transition:all .15s}
.dup-remove-btn:hover{background:#dc2626;box-shadow:0 2px 8px rgba(239,68,68,.3)}
.dup-view-btn{background:#f59e0b;color:#fff;border:none;border-radius:7px;padding:6px 16px;cursor:pointer;font-size:11px;font-weight:700}
.dup-view-btn:hover{background:#d97706}

/* ===== RESTORE CONFIRM MODAL ===== */
.restore-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;display:flex;align-items:center;justify-content:center}
.restore-box{background:#fff;border-radius:14px;padding:24px;width:480px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.restore-box h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.restore-box .rb-detail{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:14px;font-size:12px}
.restore-box .rb-detail .rb-field{color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:3px}
.restore-box .rb-from{background:#fef2f2;color:#dc2626;padding:2px 8px;border-radius:4px;font-size:12px;text-decoration:line-through;display:inline-block;margin-right:6px}
.restore-box .rb-to{background:#f0fdf4;color:#16a34a;padding:2px 8px;border-radius:4px;font-size:12px;display:inline-block}

/* ===== DUPLICATE DETECTION & REMOVAL ===== */
/* ========================================= */
function findDuplicates(){
  var d=gd();
  var caCount={};var fullRowCount={};
  var dupCAs=[];var dupFullRows=[];
  
  d.forEach(function(r,idx){
    // Check by CA number (primary key for duplicates)
    var caKey=r.ca;
    if(caKey){
      if(!caCount[caKey])caCount[caKey]={count:0,indices:[]};
      caCount[caKey].count++;
      caCount[caKey].indices.push(idx);
    }
    // Check by full row data
    var fullKey=r.location+"|"+r.ca+"|"+r.brand+"|"+r.company+"|"+r.amount+"|"+r.dueDate+"|"+r.status;
    if(!fullRowCount[fullKey])fullRowCount[fullKey]={count:0,indices:[]};
    fullRowCount[fullKey].count++;
    fullRowCount[fullKey].indices.push(idx);
  });
  
  // Exact full-row duplicates
  Object.keys(fullRowCount).forEach(function(key){
    if(fullRowCount[key].count>1)dupFullRows.push({key:key,indices:fullRowCount[key].indices});
  });
  // CA-only duplicates (same CA, different data = data conflict)
  Object.keys(caCount).forEach(function(ca){
    if(caCount[ca].count>1)dupCAs.push({ca:ca,indices:caCount[ca].indices});
  });
  
  return{fullRows:dupFullRows,caConflicts:dupCAs,totalDups:dupFullRows.length,hasDups:dupFullRows.length>0||dupCAs.length>0};
}

function getDupIndices(){
  var dups=findDuplicates();
  var indices={};
  // Mark full-row duplicates (all except first occurrence)
  dups.fullRows.forEach(function(g){
    for(var i=1;i<g.indices.length;i++)indices[g.indices[i]]="full";
  });
  // Mark CA conflicts (all occurrences)
  dups.caConflicts.forEach(function(g){
    g.indices.forEach(function(idx){
      if(!indices[idx])indices[idx]="ca";
    });
  });
  return indices;
}

function removeDuplicates(){
  var dups=findDuplicates();
  if(!dups.hasDups){showToast("✅ No duplicates found");return;}
  
  var d=gd();
  var removeCount=0;
  
  // Show confirmation modal with details
  var ov=document.createElement("div");ov.className="restore-modal";
  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove();});
  var box=document.createElement("div");box.className="restore-box";box.style.width="560px";
  
  var html='<h3>⚠️ Remove Duplicate Rows</h3>';
  html+='<div class="rb-detail">';
  
  if(dups.fullRows.length){
    html+='<div style="margin-bottom:8px"><b style="color:#dc2626">'+dups.fullRows.length+' exact duplicate group(s) found</b></div>';
    dups.fullRows.forEach(function(g){
      var firstIdx=g.indices[0];
      var r=d[firstIdx];
      html+='<div style="font-size:11px;padding:4px 0;border-bottom:1px solid #f1f5f9">📍 <b>'+E(r.location)+'</b> (CA: '+E(r.ca)+') — <span style="color:#dc2626">'+g.indices.length+' copies</span>, keeping 1</div>';
      removeCount+=g.indices.length-1;
    });
  }
  
  if(dups.caConflicts.length && dups.fullRows.length===0){
    html+='<div style="margin-top:8px"><b style="color:#d97706">'+dups.caConflicts.length+' CA number(s) with different data</b></div>';
    html+='<div style="font-size:10px;color:#64748b;margin-top:4px">These have the same CA but different amounts/dates. Review manually.</div>';
  }
  
  html+='</div>';
  
  if(removeCount>0){
    html+='<div style="font-size:12px;font-weight:600;color:#dc2626;margin-bottom:4px">'+removeCount+' duplicate row(s) will be removed. First occurrence is kept.</div>';
    html+='<div class="rb-btns">';
    html+='<button class="rb-cancel" onclick="this.closest(\'.restore-modal\').remove()">Cancel</button>';
    html+='<button class="rb-confirm" style="background:#ef4444" onclick="doRemoveDuplicates();this.closest(\'.restore-modal\').remove()">🗑 Remove '+removeCount+' Duplicates</button>';
    html+='</div>';
  }else{
    html+='<div style="font-size:12px;color:#64748b;margin-bottom:4px">No exact duplicates to auto-remove. Review CA conflicts manually.</div>';
    html+='<div class="rb-btns"><button class="rb-cancel" onclick="this.closest(\'.restore-modal\').remove()">Close</button></div>';
  }
  
  box.innerHTML=html;ov.appendChild(box);document.body.appendChild(ov);
}

function doRemoveDuplicates(){
  var d=gd();
  var seen={};var deduped=[];var removed=0;
  
  d.forEach(function(r){
    var key=r.location+"|"+r.ca+"|"+r.brand+"|"+r.company+"|"+r.amount+"|"+r.dueDate+"|"+r.status;
    if(seen[key]){
      removed++;
    }else{
      seen[key]=true;
      deduped.push(r);
    }
  });
  
  logChange("edit",actMonth,"","","duplicates","Removed "+removed+" duplicate rows","");
  sd(deduped);render();
  showToast("🗑 Removed "+removed+" duplicate rows");
}

async function loadFromDB(){
  if(!isAuthed)return;
  try{
    var resp=await supaFetch(SUPA_TBL+"?select=*&order=id.asc&limit=5000");
    if(!resp.ok)throw new Error("HTTP "+resp.status);
    var rows=await resp.json();
    allData={};
    if(Array.isArray(rows)&&rows.length>0){
      rows.forEach(function(r){
        var m=r.month||"Apr 2026";
        if(!allData[m])allData[m]=[];
        allData[m].push({id:String(r.id),_dbId:r.id,location:r.location||"",brand:r.brand||"",company:r.company||"",ca:r.ca||"",billDate:r.bill_date||"",amount:r.amount||"",dueDate:r.due_date||"",status:r.status||"",remarks:r.remarks||"",billLink:r.bill_link||"",receiptLink:r.receipt_link||"",amount2:r.amount_2||"",dueDate2:r.due_date_2||"",paidBy2:r.paid_by_2||"",status2:r.status_2||""});
      });
      var sorted=Object.keys(allData).sort(mSort);
      actMonth=sorted[sorted.length-1];
      syncStatus="ok";
    }else{
      allData={"Apr 2026":[]};
      actMonth="Apr 2026";
      syncStatus="ok";
    }
  }catch(e){
    console.log("DB load error:",e);
    allData={"Apr 2026":[]};
    actMonth="Apr 2026";
    syncStatus="err";
  }
  _lastDataHash=dataHash();
  loadHistory();
  render();
}

async function saveToDB(){if(saveQueue)clearTimeout(saveQueue);saveQueue=setTimeout(doSave,800);}

var _saveInProgress=false;

async function doSave(){
  if(_saveInProgress||saving)return;
  _saveInProgress=true;saving=true;syncStatus="saving";render();
  try{
    var m=actMonth;
    // Use select to verify delete worked before inserting
    var delResp=await supaFetch(SUPA_TBL+"?month=eq."+encodeURIComponent(m),{method:"DELETE"});
    if(!delResp.ok)throw new Error("Delete failed: "+delResp.status);
    // Small delay to ensure delete propagated
    await new Promise(function(r){setTimeout(r,100);});
    var d=gd();
    if(d.length>0){
      var rows=d.map(function(r){
        return{month:m,location:r.location,brand:r.brand,company:r.company,ca:r.ca,bill_date:r.billDate,amount:r.amount,due_date:r.dueDate,status:r.status,remarks:r.remarks,bill_link:r.billLink,receipt_link:r.receiptLink,amount_2:r.amount2||"",due_date_2:r.dueDate2||"",paid_by_2:r.paidBy2||"",status_2:r.status2||""};
      });
      var resp=await supaFetch(SUPA_TBL,{method:"POST",body:rows,prefer:"return=representation"});
      var ins=await resp.json();
      if(Array.isArray(ins)){
        for(var i=0;i<ins.length&&i<d.length;i++){d[i]._dbId=ins[i].id;d[i].id=String(ins[i].id);}
      }
    }
    syncStatus="ok";
    _lastDataHash=dataHash();
  }catch(e){console.log("Save error:",e);syncStatus="err";}
  saving=false;_saveInProgress=false;render();
}

function mSort(a,b){
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var pa=(a||"").split(" "),pb=(b||"").split(" ");
  var ya=parseInt(pa[1])||0,yb=parseInt(pb[1])||0;
  if(ya!==yb)return ya-yb;
  return(M.indexOf(pa[0])||0)-(M.indexOf(pb[0])||0);
}

function isCurr(m){
  try{
    var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p=(m||"").split(" ");
    if(p.length<2)return true;
    var mi=M.indexOf(p[0]),yi=parseInt(p[1]);
    if(isNaN(yi)||mi<0)return true;
    var n=new Date();
    if(yi>n.getFullYear())return true;
    if(yi<n.getFullYear())return false;
    return mi>=n.getMonth();
  }catch(e){return true;}
}

function displayDate(d){
  if(!d)return"";
  var m=d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return m[3]+"."+m[2]+"."+m[1];
  return d;
}

function dueTag(d,status){
  if(!d||!isCurr(actMonth))return null;
  if(status&&status.toLowerCase().indexOf("paid")>=0)return null;
  var dt=d;
  if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
  try{
    var dd=new Date(dt+"T00:00:00"),now=new Date();
    now.setHours(0,0,0,0);
    var diff=Math.ceil((dd-now)/864e5);
    if(diff<0)return{l:"Overdue ("+Math.abs(diff)+"d)",c:"#dc2626",b:"#fef2f2"};
    if(diff===0)return{l:"Due Today!",c:"#dc2626",b:"#fef2f2"};
    if(diff<=3)return{l:"Due in "+diff+"d",c:"#ea580c",b:"#fff7ed"};
    if(diff<=5)return{l:"Due in "+diff+"d",c:"#d97706",b:"#fffbeb"};
    if(diff<=7)return{l:"Due in "+diff+"d",c:"#ca8a04",b:"#fefce8"};
    return{l:"Due in "+diff+"d",c:"#16a34a",b:"#f0fdf4"};
  }catch(e){return null;}
}

function getStats(d){
  var now=new Date();now.setHours(0,0,0,0);
  var o=0,t=0,amt=0,oAmt=0,tAmt=0,ic=isCurr(actMonth);
  // Date range stats
  var drCount=0,drAmt=0;
  d.forEach(function(r){
    var a=parseFloat(r.amount)||0;
    var a2=parseFloat(r.amount2)||0;
    if(a>0)amt+=a;
    if(a2>0)amt+=a2;
    if(!ic)return;
    // Bill 1 due check
    if(r.dueDate){
      var paid=(r.status||"").toLowerCase().indexOf("paid")>=0;
      if(!paid){
        var dt=r.dueDate;if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
        var dd=new Date(dt+"T00:00:00");
        if(!isNaN(dd.getTime())){
          var diff=Math.ceil((dd-now)/864e5);
          if(diff<0){o++;oAmt+=a;}
          if(diff===0){t++;tAmt+=a;}
          if(drFrom&&drTo){var fromD=new Date(drFrom+"T00:00:00");var toD=new Date(drTo+"T00:00:00");if(dd>=fromD&&dd<=toD){drCount++;drAmt+=a;}}
        }
      }
    }
    // Bill 2 due check
    if(r.dueDate2){
      var paid2=(r.status2||"").toLowerCase().indexOf("paid")>=0;
      if(!paid2){
        var dt2=r.dueDate2;if(!/^\d{4}-/.test(dt2))dt2=parseDate(dt2);
        var dd2=new Date(dt2+"T00:00:00");
        if(!isNaN(dd2.getTime())){
          var diff2=Math.ceil((dd2-now)/864e5);
          if(diff2<0){o++;oAmt+=a2;}
          if(diff2===0){t++;tAmt+=a2;}
          if(drFrom&&drTo){var fromD2=new Date(drFrom+"T00:00:00");var toD2=new Date(drTo+"T00:00:00");if(dd2>=fromD2&&dd2<=toD2){drCount++;drAmt+=a2;}}
        }
      }
    }
  });
  return{ov:o,td:t,total:d.length,amt:amt,oAmt:oAmt,tAmt:tAmt,drCount:drCount,drAmt:drAmt};
}

function getF(){
  var d=gd().slice();
  if(srch){var s=srch.toLowerCase();d=d.filter(function(r){return r.location.toLowerCase().indexOf(s)>=0||r.ca.indexOf(s)>=0||r.brand.toLowerCase().indexOf(s)>=0;});}
  if(compF!=="all")d=d.filter(function(r){return r.company===compF;});
  if(brandF!=="all")d=d.filter(function(r){return r.brand===brandF;});
  if(flt==="daterange"&&drFrom&&drTo&&isCurr(actMonth)){
    d=d.filter(function(r){
      if(!r.dueDate)return false;
      var paid=(r.status||"").toLowerCase().indexOf("paid")>=0;
      if(paid)return false;
      var dt=r.dueDate;
      if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
      var dd=new Date(dt+"T00:00:00");
      if(isNaN(dd.getTime()))return false;
      var fromD=new Date(drFrom+"T00:00:00");
      var toD=new Date(drTo+"T00:00:00");
      return dd>=fromD&&dd<=toD;
    });
  }else if(flt!=="all"&&flt!=="daterange"&&isCurr(actMonth)){
    var now=new Date();now.setHours(0,0,0,0);
    d=d.filter(function(r){
      if(!r.dueDate)return false;
      var paid=(r.status||"").toLowerCase().indexOf("paid")>=0;
      if(paid)return false;
      var dt=r.dueDate;
      if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
      var dd=new Date(dt+"T00:00:00");
      if(isNaN(dd.getTime()))return false;
      var diff=Math.ceil((dd-now)/864e5);
      if(flt==="overdue")return diff<0;
      if(flt==="today")return diff===0;
      return true;
    });
  }
  if(sCol)d.sort(function(a,b){var va=a[sCol]||"",vb=b[sCol]||"";if(sCol==="amount"){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}return va<vb?(sDir==="asc"?-1:1):va>vb?(sDir==="asc"?1:-1):0;});
  return d;
}

var COL_MAP={"location":["location","store","site","place","loc"],"brand":["brand","brand name"],"company":["company","electricity company","elec company","provider","discom"],"ca":["ca","ca no","ca no.","ca number","consumer no","consumer number","account"],"billDate":["bill date","billdate","billing date"],"amount":["amount","amt","bill amount","rs amount","bill amt","total"],"dueDate":["due date","duedate","due","payment due","due by","last date","status payment date","status payment date","status and payment date"],"status":["status","payment status","paid","payment"],"remarks":["remarks","remark","notes","note","comment","comments"],"billLink":["bill link","billlink","bill url"],"receiptLink":["receipt link","receiptlink","receipt url"],"amount2":["amount 2","amt 2","bill amount 2","amount2"],"dueDate2":["due date 2","duedate2","due 2","due date2"],"paidBy2":["paid by 2","paidby2","paid by2","paid 2"],"status2":["status 2","status2","payment status 2"]};

function matchCol(header){
  var raw=header.toLowerCase().trim();
  if(raw==="s.no"||raw==="s no"||raw==="sno"||raw==="#"||raw==="sr"||raw==="sr no"||raw==="sr."||raw==="sr.no")return null;
  if(raw==="bill no"||raw==="bill no."||raw==="bill number"||raw==="billno")return null;
  if(raw==="status & payment date"||raw==="status &amp; payment date"||raw==="status and payment date")return"dueDate";
  if(raw==="₹ amount"||raw==="rs amount"||raw==="bill amount"||raw==="amount")return"amount";
  if(raw==="electricity company")return"company";
  if(raw==="ca no."||raw==="ca no"||raw==="ca number")return"ca";
  if(raw==="due date")return"dueDate";
  if(raw==="bill date")return"billDate";
  if(raw==="bill link")return"billLink";
  if(raw==="receipt link")return"receiptLink";
  if(raw==="location")return"location";
  if(raw==="brand")return"brand";
  if(raw==="status")return"status";
  if(raw==="remarks"||raw==="remark")return"remarks";
  var h=raw.replace(/[₹&]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  for(var field in COL_MAP){for(var i=0;i<COL_MAP[field].length;i++){if(h===COL_MAP[field][i])return field;}}
  for(var field in COL_MAP){for(var i=0;i<COL_MAP[field].length;i++){if(h.indexOf(COL_MAP[field][i])>=0)return field;}}
  return null;
}

function parseImportRows(sheet){
  var json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:true});
  if(!json||json.length<2)return{headers:[],rows:[],mapped:{}};
  var rawH=json[0].map(function(h){return String(h).trim();});
  var mapped={};
  rawH.forEach(function(h,i){var m=matchCol(h);if(m)mapped[m]=i;});
  var rows=[];
  for(var r=1;r<json.length;r++){
    var row=json[r];var empty=true;
    for(var c=0;c<row.length;c++){if(String(row[c]).trim()){empty=false;break;}}
    if(!empty)rows.push(row);
  }
  return{headers:rawH,rows:rows,mapped:mapped};
}

function parseDate(v){
  if(!v&&v!==0)return"";
  if(v instanceof Date){if(!isNaN(v.getTime()))return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");return"";}
  if(typeof v==="number"){if(v>30000&&v<60000){var d=new Date(Math.round((v-25569)*86400*1000));if(!isNaN(d.getTime()))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}return"";}
  var s=String(v).trim();
  if(!s)return"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var md=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(md)return md[3]+"-"+String(md[2]).padStart(2,"0")+"-"+String(md[1]).padStart(2,"0");
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){var day=parseInt(m[1]),mon=parseInt(m[2]);if(day>12)return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");if(mon>12)return m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");}
  var m3=s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if(m3)return m3[1]+"-"+String(m3[2]).padStart(2,"0")+"-"+String(m3[3]).padStart(2,"0");
  var m4=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(m4)return m4[1]+"-"+m4[2]+"-"+m4[3];
  var d2=new Date(s);
  if(!isNaN(d2.getTime())&&d2.getFullYear()>2000)return d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+String(d2.getDate()).padStart(2,"0");
  return s;
}

function rowToRecord(row,mapped){
  function g(field){if(mapped[field]===undefined)return"";var v=row[mapped[field]];return v===undefined||v===null?"":String(v).trim();}
  function gd(field){if(mapped[field]===undefined)return"";var v=row[mapped[field]];if(v===undefined||v===null)return"";return parseDate(v);}
  return{id:String(_n++),location:g("location"),brand:g("brand"),company:g("company"),ca:g("ca"),billDate:gd("billDate"),amount:g("amount"),dueDate:gd("dueDate"),status:g("status"),remarks:g("remarks"),billLink:g("billLink"),receiptLink:g("receiptLink"),amount2:g("amount2"),dueDate2:gd("dueDate2"),paidBy2:g("paidBy2"),status2:g("status2")};
}

function showImportModal(parsed){

function triggerImport(){var inp=document.getElementById("csvFileInput");inp.value="";inp.click();}

document.getElementById("csvFileInput").addEventListener("change",function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(evt){
    try{
      var data=new Uint8Array(evt.target.result);
      var wb=XLSX.read(data,{type:"array",cellDates:true,raw:false});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var parsed=parseImportRows(ws);
      if(!parsed.rows.length){alert("No data rows found.");return;}
      showImportModal(parsed);
    }catch(err){alert("Error: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
});

function showSuggestions(v){
  var drop=document.getElementById("srchDrop");if(!drop)return;
  if(!v||v.length<1){drop.style.display="none";return;}
  var s=v.toLowerCase();var data=gd();var seen={};var items=[];
  data.forEach(function(r){
    [{type:"📍 Location",val:r.location},{type:"🏷 Brand",val:r.brand},{type:"🔢 CA No.",val:r.ca},{type:"🏢 Company",val:r.company}].forEach(function(f){
      if(!f.val)return;
      if(f.val.toLowerCase().indexOf(s)>=0){var key=f.type+":"+f.val;if(!seen[key]){seen[key]=1;items.push(f);}}
    });
  });
  if(!items.length){drop.style.display="none";return;}
  items=items.slice(0,10);
  var h='';
  items.forEach(function(it){
    var safe=E(it.val).replace(/'/g,"\\'");
    h+='<div style="padding:7px 12px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #f1f5f9" onmousedown="pickSugg(\''+safe+'\')" onmouseover="this.style.background=\'#eff6ff\'" onmouseout="this.style.background=\'#fff\'"><span style="font-size:10px;color:#94a3b8;white-space:nowrap">'+it.type+'</span><span>'+E(it.val)+'</span></div>';
  });
  drop.innerHTML=h;drop.style.display="block";
}

function pickSugg(val){

function se(id,fd){
  var d=gd();
  for(var i=0;i<d.length;i++){if(d[i].id===id){editing=id+"_"+fd;editVal=d[i][fd]||"";break;}}
  render();
}

function cn(){editing=null;editVal="";render();}

function sv(id,fd){
  var v=editVal;
  if((fd==="status"||fd==="status2")&&v.toLowerCase().indexOf("paid")>=0&&!/\d{2}\.\d{2}\.\d{4}/.test(v)&&!/\d{4}-\d{2}-\d{2}/.test(v)&&!/\d{1,2}(st|nd|rd|th)\s/i.test(v)){
    var t=new Date();var ds=String(t.getDate()).padStart(2,"0")+"."+String(t.getMonth()+1).padStart(2,"0")+"."+t.getFullYear();
    v=v.replace(/\s*$/,"")+" on "+ds;
  }
  var d=gd();
  for(var i=0;i<d.length;i++){
    if(d[i].id===id){
      var oldVal=d[i][fd]||"";
      logChange("edit",actMonth,d[i].location,d[i].ca,fd,oldVal,v);
      d[i][fd]=v;
      break;
    }
  }
  sd(d);editing=null;editVal="";render();
}

function ck(e,id,fd){if(e.key==="Enter")sv(id,fd);if(e.key==="Escape")cn();}

function rmF(id,fd){
  var d=gd();
  for(var i=0;i<d.length;i++){
    if(d[i].id===id){
      logChange("edit",actMonth,d[i].location,d[i].ca,fd,d[i][fd],"");
      d[i][fd]="";
      break;
    }

  sd(d);render();
}

  logChange("delete",actMonth,r.location,r.ca,"","",JSON.stringify(rowBackup));
  sd(d.filter(function(x){return x.id!==id;}));render();
}

function addMonth(){
  var name=prompt("Month name (e.g. May 2026):","");
  if(!name||!name.trim())return;
  var n=name.trim();
  if(allData[n]){alert("Exists!");return;}
  var prev=gd();
  allData[n]=prev.map(function(r){
    return{id:String(_n++),location:r.location,brand:r.brand,company:r.company,ca:r.ca,billDate:"",amount:"",dueDate:"",status:"",remarks:"",billLink:"",receiptLink:"",amount2:"",dueDate2:"",paidBy2:"",status2:""};
  });
  actMonth=n;saveToDB();render();
}

async function delMonth(){
  var m=actMonth;var months=Object.keys(allData);
  if(months.length<=1){alert("Cannot delete last month.");return;}
  var cnt=(allData[m]||[]).length;
  var step1=prompt("⚠️ DELETE \""+m+"\" ("+cnt+" stores)?\nType month name exactly:");
  if(!step1||step1.trim()!==m)return;
  if(!confirm("🔴 FINAL: Delete "+m+"?"))return;
  logChange("reset",m,"","","","","Deleted month with "+cnt+" records");
  delete allData[m];
  try{supaFetch(SUPA_TBL+"?month=eq."+encodeURIComponent(m),{method:"DELETE"});}catch(e){}
  var rem=Object.keys(allData).sort(mSort);actMonth=rem[rem.length-1];render();
}

async function resetM(){
  var cnt=(allData[actMonth]||[]).length;
  var s=prompt("⚠️ RESET \""+actMonth+"\"? Type RESET:");
  if(!s||s.trim()!=="RESET")return;
  logChange("reset",actMonth,"","","","","Reset month (had "+cnt+" records)");
  allData[actMonth]=[];sd([]);render();showToast("🗑 Cleared "+actMonth);
}
